name: MASQUE

# The upstream test workflow only runs on main, so nothing tests the MASQUE
# branch otherwise. This covers the packages it adds or changes, the loopback
# fix included, under the race detector, since most of what can go wrong there
# is two pumps and a teardown racing each other.
#
# The tags are the ones the app builds with. Since Go 1.27, golang.org/x/net's
# HTTP/2 client is a wrapper around net/http's own unless http2legacy is set,
# and the HTTP/2 mode runs on whichever one that picks. The app no longer sets
# it, so neither does this.

on:
  push:
    branches:
      - masque
    paths:
      - "proxy/masque/**"
      - "proxy/wireguard/netstack/**"
      - "proxy/loopback/**"
      - "infra/conf/v4/masque.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/masque.yml"
  pull_request:
    branches:
      - masque
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ~1.27
          cache-dependency-path: ./go.sum

      - name: Vet
        run: go vet ./proxy/masque/... ./proxy/wireguard/netstack/... ./proxy/loopback/...

      - name: Run tests
        run: go test -race -count=1 ./proxy/masque/... ./proxy/wireguard/netstack/... ./proxy/loopback/... ./infra/conf/v4/...

      - name: Build for Android
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build -tags with_clash ./main/distro/all
